version: '3.8'

services:
  bot:
    build: .
    container_name: pnptv-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - pnptv-network

  redis:
    image: redis:7-alpine
    container_name: pnptv-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - pnptv-network

volumes:
  redis-data:

networks:
  pnptv-network:
    driver: bridge
